name = "review-insight"
main = "src/worker.js"
compatibility_date = "2026-08-18"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "review-insight-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"

[[r2_buckets]]
binding = "REVIEW_UPLOADS"
bucket_name = "review-insight-uploads"

# Dashboard 또는 `wrangler secret put`으로 설정:
# SESSION_SECRET, TOSS_SECRET_KEY, TOSS_CLIENT_KEY, AI_API_KEY,
# TURNSTILE_SECRET, TURNSTILE_SITE_KEY, PAYMENT_PROVIDER
