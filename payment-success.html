<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결제 확인 | 리뷰인사이트</title><link rel="stylesheet" href="styles.css"></head><body><main class="section legal"><div class="eyebrow">VERIFYING PAYMENT</div><h1>결제를 확인하고 있습니다.</h1><p id="message">Paddle의 서명된 결제 알림을 확인하는 중입니다.</p><p><a href="index.html">대시보드로 돌아가기</a></p></main><script>
const orderId=new URLSearchParams(location.search).get('orderId');const message=document.querySelector('#message');let attempts=0;async function check(){try{if(!orderId)throw new Error('주문번호가 없습니다.');const response=await fetch(`/api/payments/status/${encodeURIComponent(orderId)}`);const data=await response.json();if(!response.ok)throw new Error(data.error||'결제 정보를 확인하지 못했습니다.');if(data.status==='PAID'&&data.access?.fullResults){message.textContent=`${data.access.planName} 플랜이 활성화되어 기존 분석의 전체 결과가 열렸습니다. 대시보드로 이동합니다.`;return setTimeout(()=>location.href='/',1200);}if(++attempts<30)return setTimeout(check,1000);message.textContent='구독 확인이 지연되고 있습니다. 잠시 후 대시보드에서 플랜 상태를 확인해주세요.';}catch(error){message.textContent=`결제 확인에 실패했습니다: ${error.message}`;}}check();
</script></body></html>
