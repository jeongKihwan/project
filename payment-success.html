<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결제 확인 | 리뷰인사이트</title><link rel="stylesheet" href="styles.css"></head><body><main class="section legal"><div class="eyebrow">VERIFYING PAYMENT</div><h1>결제를 확인하고 있습니다.</h1><p id="message">서버에서 결제 금액과 상태를 검증하는 중입니다.</p></main><script>
const q=new URLSearchParams(location.search);fetch('/api/payments/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:q.get('orderId'),paymentKey:q.get('paymentKey')})}).then(async r=>{const data=await r.json();if(!r.ok)throw new Error(data.error);document.querySelector('#message').textContent='결제가 확인되어 크레딧이 지급되었습니다. 대시보드로 이동합니다.';setTimeout(()=>location.href='/',1200)}).catch(e=>document.querySelector('#message').textContent=`결제 확인에 실패했습니다: ${e.message}`);
</script></body></html>
