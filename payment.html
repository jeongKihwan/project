<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>안전한 결제 | Review Insight</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script></head><body class="payment-page"><header class="payment-header"><a class="payment-brand" href="index.html"><span>RI</span><b>Review Insight</b></a><div class="secure-label"><i>✓</i> 보안 결제</div></header><main class="payment-layout"><section class="payment-intro"><div class="eyebrow">SECURE CHECKOUT</div><h1>안전하게 구독을<br>시작하세요.</h1><p>결제가 완료되면 선택한 플랜과 전체 분석 결과가 자동으로 활성화됩니다.</p><ol><li class="active"><span>1</span><b>플랜 확인</b></li><li><span>2</span><b>안전한 결제</b></li><li><span>3</span><b>즉시 활성화</b></li></ol></section><section class="payment-card"><div class="payment-icon">✓</div><small>Review Insight 구독</small><h2>결제를 진행하세요</h2><div class="payment-status"><i></i><p id="payment-info" role="status" aria-live="polite">결제 정보를 준비하고 있습니다.</p></div><button id="pay-button" class="payment-button" disabled><span>안전한 결제창 열기</span><b>→</b></button><ul><li>카드정보 자체 저장 없음</li><li>결제 확인 후 플랜 즉시 활성화</li></ul><p class="paddle-note">결제는 Paddle에서 안전하게 처리됩니다.</p></section></main><footer class="payment-footer"><a href="index.html">← 서비스로 돌아가기</a><span>© 2026 Review Insight</span></footer><script>
const params=new URLSearchParams(location.search);const orderId=params.get('orderId');const info=document.querySelector('#payment-info');const button=document.querySelector('#pay-button');
const errorMessage=(error)=>error?.detail||error?.message||error?.code||String(error||'알 수 없는 오류');
function showCheckoutError(error){info.textContent=`결제창 오류: ${errorMessage(error)}`;button.disabled=false;button.textContent='결제창 다시 열기';console.error('PADDLE_CHECKOUT_ERROR',error);}
function waitForPaddle(timeout=8000){return new Promise((resolve,reject)=>{if(window.Paddle?.Checkout?.open)return resolve(window.Paddle);const startedAt=Date.now(),timer=setInterval(()=>{if(window.Paddle?.Checkout?.open){clearInterval(timer);resolve(window.Paddle);}else if(Date.now()-startedAt>=timeout){clearInterval(timer);reject(new Error('Paddle.js를 불러오지 못했습니다. 네트워크 상태를 확인해주세요.'));}},100);});}
async function start(){try{if(!orderId)throw new Error('주문번호가 없습니다.');const response=await fetch(`/api/payments/checkout/${encodeURIComponent(orderId)}`);const data=await response.json();if(!response.ok)throw new Error(data.error||'결제 정보를 불러오지 못했습니다.');if(data.provider!=='paddle')throw new Error('결제 제공업체가 올바르지 않습니다.');if(data.environment!=='live')throw new Error('Live 결제 설정이 아닙니다.');if(!String(data.clientToken||'').startsWith('live_'))throw new Error('Live Client Token이 올바르지 않습니다.');if(!/^pri_[a-z0-9]{26}$/.test(data.priceId||''))throw new Error('선택한 플랜의 Live Price ID가 올바르지 않습니다.');const paddle=await waitForPaddle();paddle.Initialize({token:data.clientToken,eventCallback:(event)=>{if(event.name==='checkout.loaded'){info.textContent=`${data.orderName} 결제창이 열렸습니다.`;button.disabled=false;button.textContent='안전한 결제창 열기';}if(event.name==='checkout.error'||event.name==='checkout.warning')showCheckoutError(event);if(event.name==='checkout.completed')location.href=`/payment-success.html?orderId=${encodeURIComponent(data.orderId)}`;}});info.textContent=`${data.orderName} 월간 구독을 Paddle Live 결제로 진행합니다.`;button.disabled=false;button.addEventListener('click',()=>{button.disabled=true;button.textContent='결제창 여는 중...';info.textContent='Paddle Live 결제창을 여는 중입니다.';try{paddle.Checkout.open({items:[{priceId:data.priceId,quantity:1}],customer:{email:data.customerEmail},customData:{payment_id:data.orderId,payment_token:data.paymentToken},settings:{displayMode:'overlay',theme:'light',locale:'ko',successUrl:`${location.origin}/payment-success.html?orderId=${encodeURIComponent(data.orderId)}`}});}catch(error){showCheckoutError(error);}});}catch(error){showCheckoutError(error);}}
window.addEventListener('unhandledrejection',(event)=>showCheckoutError(event.reason));
start();
</script></body></html>
