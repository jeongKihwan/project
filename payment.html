<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결제 | 리뷰인사이트</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script></head><body><main class="section legal"><div class="eyebrow">SECURE PAYMENT</div><h1>결제를 진행하세요.</h1><p id="payment-info">결제 정보를 준비하고 있습니다.</p><button id="pay-button" class="primary-button" disabled>안전한 결제창 열기</button><p>카드정보는 Paddle에서 처리하며 리뷰인사이트 서버에 저장되지 않습니다.</p></main><script>
const params=new URLSearchParams(location.search);const orderId=params.get('orderId');const info=document.querySelector('#payment-info');const button=document.querySelector('#pay-button');
const errorMessage=(error)=>error?.detail||error?.message||error?.code||String(error||'알 수 없는 오류');
function showCheckoutError(error){info.textContent=`결제창 오류: ${errorMessage(error)}`;button.disabled=false;button.textContent='결제창 다시 열기';console.error('PADDLE_CHECKOUT_ERROR',error);}
function waitForPaddle(timeout=8000){return new Promise((resolve,reject)=>{if(window.Paddle?.Checkout?.open)return resolve(window.Paddle);const startedAt=Date.now(),timer=setInterval(()=>{if(window.Paddle?.Checkout?.open){clearInterval(timer);resolve(window.Paddle);}else if(Date.now()-startedAt>=timeout){clearInterval(timer);reject(new Error('Paddle.js를 불러오지 못했습니다. 네트워크 상태를 확인해주세요.'));}},100);});}
async function start(){try{if(!orderId)throw new Error('주문번호가 없습니다.');const response=await fetch(`/api/payments/checkout/${encodeURIComponent(orderId)}`);const data=await response.json();if(!response.ok)throw new Error(data.error||'결제 정보를 불러오지 못했습니다.');if(data.provider!=='paddle')throw new Error('결제 제공업체가 올바르지 않습니다.');if(data.environment!=='sandbox')throw new Error('Sandbox 결제 설정이 아닙니다.');if(!String(data.clientToken||'').startsWith('test_'))throw new Error('Sandbox Client Token이 올바르지 않습니다.');if(!/^pri_[a-z0-9]{26}$/.test(data.priceId||''))throw new Error('선택한 플랜의 Sandbox Price ID가 올바르지 않습니다.');const paddle=await waitForPaddle();paddle.Environment.set('sandbox');paddle.Initialize({token:data.clientToken,eventCallback:(event)=>{if(event.name==='checkout.loaded'){info.textContent=`${data.orderName} Sandbox 결제창이 열렸습니다.`;button.disabled=false;button.textContent='안전한 결제창 열기';}if(event.name==='checkout.error'||event.name==='checkout.warning')showCheckoutError(event);if(event.name==='checkout.completed')location.href=`/payment-success.html?orderId=${encodeURIComponent(data.orderId)}`;}});info.textContent=`${data.orderName} 월간 구독을 Paddle Sandbox 결제창에서 진행합니다.`;button.disabled=false;button.addEventListener('click',()=>{button.disabled=true;button.textContent='결제창 여는 중...';info.textContent='Paddle Sandbox 결제창을 여는 중입니다.';try{paddle.Checkout.open({items:[{priceId:data.priceId,quantity:1}],customer:{email:data.customerEmail},customData:{payment_id:data.orderId,payment_token:data.paymentToken},settings:{displayMode:'overlay',theme:'light',locale:'ko',successUrl:`${location.origin}/payment-success.html?orderId=${encodeURIComponent(data.orderId)}`}});}catch(error){showCheckoutError(error);}});}catch(error){showCheckoutError(error);}}
window.addEventListener('unhandledrejection',(event)=>showCheckoutError(event.reason));
start();
</script></body></html>
