<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결제 | 리뷰인사이트</title><link rel="stylesheet" href="styles.css"><script src="https://js.tosspayments.com/v2/standard"></script></head><body><main class="section legal"><div class="eyebrow">SECURE PAYMENT</div><h1>결제 수단을 선택하세요.</h1><p id="payment-info">결제 정보를 준비하고 있습니다.</p><div id="payment-method"></div><div id="agreement"></div><button id="pay-button" class="primary-button">결제하기</button></main><script>
const params=new URLSearchParams(location.search);const orderId=params.get('orderId');
async function start(){try{if(!orderId)throw new Error('주문번호가 없습니다.');const response=await fetch(`/api/payments/checkout/${encodeURIComponent(orderId)}`);const data=await response.json();if(!response.ok)throw new Error(data.error||'결제 정보를 불러오지 못했습니다.');document.querySelector('#payment-info').textContent=`${data.orderName} · ${data.amount.toLocaleString()}원`;const tossPayments=TossPayments(data.clientKey);const widgets=tossPayments.widgets({customerKey:data.customerKey});await widgets.setAmount({currency:'KRW',value:data.amount});await widgets.renderPaymentMethods({selector:'#payment-method',variantKey:'DEFAULT'});await widgets.renderAgreement({selector:'#agreement',variantKey:'AGREEMENT'});document.querySelector('#pay-button').onclick=()=>widgets.requestPayment({orderId:data.orderId,orderName:data.orderName,successUrl:`${location.origin}/payment-success.html`,failUrl:`${location.origin}/payment-fail.html`});}catch(error){document.querySelector('#pay-button').disabled=true;document.querySelector('#payment-info').textContent=error.message||'결제창을 불러오지 못했습니다.';}}
start();
</script></body></html>
