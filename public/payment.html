<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결제 | 리뷰인사이트</title><link rel="stylesheet" href="styles.css"><script src="https://js.tosspayments.com/v2/standard"></script></head><body><main class="section legal"><div class="eyebrow">SECURE PAYMENT</div><h1>결제 수단을 선택하세요.</h1><p id="payment-info">결제 정보를 준비하고 있습니다.</p><div id="payment-method"></div><div id="agreement"></div><button id="pay-button" class="primary-button">결제하기</button></main><script>
const params=new URLSearchParams(location.search);const clientKey=params.get('clientKey'),orderId=params.get('orderId'),amount=Number(params.get('amount')),orderName=params.get('orderName'),customerKey=params.get('customerKey');
document.querySelector('#payment-info').textContent=`${orderName} · ${amount.toLocaleString()}원`;
async function start(){try{const tossPayments=TossPayments(clientKey);const widgets=tossPayments.widgets({customerKey});await widgets.setAmount({currency:'KRW',value:amount});await widgets.renderPaymentMethods({selector:'#payment-method',variantKey:'DEFAULT'});await widgets.renderAgreement({selector:'#agreement',variantKey:'AGREEMENT'});document.querySelector('#pay-button').onclick=()=>widgets.requestPayment({orderId,orderName,successUrl:`${location.origin}/payment-success.html`,failUrl:`${location.origin}/payment-fail.html`});}catch(error){document.querySelector('#payment-info').textContent=error.message||'결제창을 불러오지 못했습니다.';}}
start();
</script></body></html>
