<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>결제 | 리뷰인사이트</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script></head><body><main class="section legal"><div class="eyebrow">SECURE PAYMENT</div><h1>결제를 진행하세요.</h1><p id="payment-info">결제 정보를 준비하고 있습니다.</p><button id="pay-button" class="primary-button" disabled>안전한 결제창 열기</button><p>카드정보는 Paddle에서 처리하며 리뷰인사이트 서버에 저장되지 않습니다.</p></main><script>
const params=new URLSearchParams(location.search);const orderId=params.get('orderId');
async function start(){try{if(!orderId)throw new Error('주문번호가 없습니다.');const response=await fetch(`/api/payments/checkout/${encodeURIComponent(orderId)}`);const data=await response.json();if(!response.ok)throw new Error(data.error||'결제 정보를 불러오지 못했습니다.');if(data.provider!=='paddle')throw new Error('결제 제공업체가 올바르지 않습니다.');if(data.environment==='sandbox')Paddle.Environment.set('sandbox');Paddle.Initialize({token:data.clientToken,locale:'ko',eventCallback:(event)=>{if(event.name==='checkout.completed')location.href=`/payment-success.html?orderId=${encodeURIComponent(data.orderId)}`;}});document.querySelector('#payment-info').textContent=`${data.orderName} 월간 구독을 Paddle 보안 결제창에서 진행합니다.`;const button=document.querySelector('#pay-button');button.disabled=false;button.onclick=()=>Paddle.Checkout.open({items:[{priceId:data.priceId,quantity:1}],customer:{email:data.customerEmail},customData:{payment_id:data.orderId,payment_token:data.paymentToken},settings:{displayMode:'overlay',theme:'light',successUrl:`${location.origin}/payment-success.html?orderId=${encodeURIComponent(data.orderId)}`}});}catch(error){document.querySelector('#payment-info').textContent=error.message||'결제창을 불러오지 못했습니다.';}}
start();
</script></body></html>
